<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بصيرة | Basira</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4F46E5; --bg: #F1F5F9; --card: #ffffff; --text: #0F172A; --danger: #EF4444; --success: #22C55E; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        /* تسجيل الدخول */
        #app { display: flex; flex-direction: column; min-height: 100vh; }
        .login-wrap { display: flex; align-items: center; justify-content: center; flex: 1; }
        .login-card { background: var(--card); padding: 40px; border-radius: 25px; width: 380px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .logo { width: 150px; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #E2E8F0; text-align: center; font-size: 16px; }
        .btn-main { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; font-size: 17px; }

        /* الداشبورد */
        .container { padding: 25px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .box { background: var(--card); padding: 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h3 { margin-bottom: 15px; color: var(--primary); border-bottom: 2px solid #F1F5F9; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: right; padding: 12px; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .red { background: #FEE2E2; color: var(--danger); }
        .green { background: #DCFCE7; color: var(--success); }
        .btn-sm { padding: 6px 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div id="app"></div>

<script>
/* البيانات المحاكية */
const teachers = [
    { name: "موضي", subject: "شريعة", score: 96 },
    { name: "صالحة", subject: "لغتي", score: 82 }
];

const students = [
    { name: "عمار عايض", points: 88, attendance: "98%", progress: "92%", notes: "إزعاج بسيط" }
];

/* تشغيل واجهة الدخول */
function showLogin() {
    document.getElementById('app').innerHTML = `
        <div class="login-wrap">
            <div class="login-card">
                <img src="logo.png.PNG" class="logo" onerror="this.src='https://via.placeholder.com/150?text=Basira'">
                <h1>تسجيل الدخول</h1>
                <input id="user" placeholder="اسم المستخدم (هيا، داليا، البندري، صالحة، عمار)">
                <input type="password" placeholder="كلمة المرور">
                <button class="btn-main" onclick="handleLogin()">دخول للنظام</button>
            </div>
        </div>`;
}

function handleLogin() {
    const u = document.getElementById('user').value.trim();
    if (!u) return alert("أدخل الاسم");
    
    // توجيه الأدوار
    if (u === "هيا") buildAdmin();
    else if (u === "البندري") buildWakil();
    else if (u === "داليا") buildMurshid();
    else if (u === "صالحة" || u === "موضي") buildTeacher(u);
    else buildStudent(u);
}

/* 1. لوحة المديرة (هيا) */
function buildAdmin() {
    renderLayout("لوحة المديرة", "الإدارة العليا", `
        <div class="box">
            <h3>📊 أداء المدرسة</h3>
            <canvas id="mainChart"></canvas>
</div>
        <div class="box">
            <h3>👩‍🏫 الأداء الوظيفي (المعلمات)</h3>
            <table>
                <tr><th>المعلمة</th><th>الدرجة</th><th>حفظ</th></tr>
                ${teachers.map(t => `<tr><td>${t.name}</td><td><input type="number" value="${t.score}" style="width:50px"></td><td><button class="btn-sm">تعديل</button></td></tr>`).join('')}
            </table>
        </div>
        <div class="box">
            <h3>📩 تذاكر واعتراضات</h3>
            <p>• اعتراض من أ. صالحة (التقييم)</p>
            <p>• تذكرة ولي أمر عمار (سلوك)</p>
        </div>
        <div class="box">
            <h3>👥 القوى البشرية</h3>
            <div style="display:flex; gap:5px; flex-wrap:wrap">
                <button class="btn-sm">سائقين</button><button class="btn-sm">إداريين</button><button class="btn-sm">طلاب</button>
            </div>
        </div>
    `);
    new Chart(document.getElementById('mainChart'), { type: 'line', data: { labels: ['أ1','أ2','أ3'], datasets:[{label:'تقدم المدرسة', data:[60,85,95], borderColor:'#4F46E5'}] } });
}

/* 2. لوحة الوكيل (البندري) */
function buildWakil() {
    renderLayout("لوحة الوكيل", "شؤون الطلاب", `
        <div class="box">
            <h3>⚠️ تذاكر الشكاوي</h3>
            <p>الطالب: عمار عايض - إزعاج</p>
            <button class="btn-sm" style="background:orange">تأكيد</button>
            <button class="btn-sm">اعتماد للمديرة</button>
        </div>
        <div class="box">
            <h3>📉 نسب التنبيهات</h3>
            <canvas id="wakilChart"></canvas>
        </div>
    `);
    new Chart(document.getElementById('wakilChart'), { type: 'pie', data: { labels: ['سلوك', 'غياب'], datasets:[{data:[30,70], backgroundColor:['#EF4444','#4F46E5']}] } });
}

/* 3. لوحة المرشد (داليا) */
function buildMurshid() {
    renderLayout("لوحة المرشد", "التوجيه الطلابي", `
        <div class="box">
            <h3>🤝 الشراكة المجتمعية</h3>
            <p>كوبونات المتاجر المتاحة: 12</p>
            <button class="btn-sm">صرف كوبون تحفيزي</button>
        </div>
        <div class="box">
            <h3>🏥 الحالات الصحية</h3>
            <p>عمار عايض: متابعة (تطبيق صحتي)</p>
        </div>
    `);
}

/* 4. لوحة المعلم (صالحة/موضي) */
function buildTeacher(name) {
    renderLayout("لوحة المعلم", "أستاذة " + name, `
        <div class="box">
            <h3>📚 فصولي</h3>
            <button class="btn-sm">1/1</button> <button class="btn-sm">2/3</button>
        </div>
        <div class="box">
            <h3>✍️ رصد نقاط للطلاب</h3>
            <table>
                <tr><th>الطالب</th><th>النقاط</th><th>إضافة</th></tr>
                <tr><td>عمار عايض</td><td>88</td><td><button class="btn-sm">+</button></td></tr>
            </table>
        </div>
        <div class="box">
            <h3>📈 أداء وظيفي</h3>
            <p>درجتك من المديرة: ${name === 'صالحة' ? '82' : '96'}</p>
            ${name === 'صالحة' ? '<button class="btn-sm" style="background:red">تقديم تذكرة اعتراض</button>' : ''}
        </div>
    `);
}

/* 5. لوحة الطالب (عمار) */
function buildStudent(name) {
    renderLayout("لوحة الطالب", name, `
        <div class="box">
            <h3>⭐ نقاطي المكافأة</h3>
            <h1 style="color:var(--success); text-align:center">88</h1>
        </div>
        <div class="box">
            <h3>📅 الحضور والتقدم</h3>
            <p>نسبة الحضور: 98%</p>
            <p>نسبة التقدم: 92%</p>
        </div>
        <div class="box">
            <h3>🔔 تنبيهات</h3>
            <p class="badge red">تنبيه سلوكي: إزعاج في حصة لغتي</p>
        </div>
    `);
}

/* وظيفة بناء الهيكل العام */
function renderLayout(title, sub, content) {
    document.getElementById('app').innerHTML = `
        <div class="container">
            <div class="header">
                <div><h1>${title}</h1><p style="color:#64748B">${sub}</p></div>
                <button class="btn-sm" style="background:var(--danger)" onclick="showLogin()">خروج</button>
            </div>
            <div class="grid">${content}</div>
        </div>`;
}

// البدء عند تحميل الصفحة
window.onload = showLogin;
