<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بصيرة | Basira Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --main-purple: #6366f1; 
            --gradient-purple: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
            --bg-light: #F8FAFC; --white: #ffffff; --text-dark: #1E293B;
            --danger: #ef4444; --success: #22c55e;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

        /* شاشة تسجيل الدخول */
        #login-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-box { text-align: center; width: 380px; padding: 40px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .login-box h1 { color: var(--main-purple); font-weight: 900; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1.5px solid #eee; text-align: center; font-size: 16px; outline: none; }
        .btn-go { background: var(--gradient-purple); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 900; font-size: 18px; }
        #error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

        /* القائمة الجانبية */
        .sidebar { width: 260px; background: var(--gradient-purple); color: white; padding: 30px 20px; display: none; flex-direction: column; }
        .sidebar h2 { font-size: 26px; font-weight: 900; margin-bottom: 40px; text-align: center; }
        .nav-link { padding: 12px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; color: rgba(255,255,255,0.8); font-size: 14px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2); color: white; }

        /* المحتوى الرئيسي */
        .main-wrapper { flex: 1; display: none; flex-direction: column; overflow-y: auto; }
        .header { height: 75px; background: var(--white); padding: 0 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; }
        .user-profile { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; border: 2px solid var(--main-purple); }

        .content { padding: 30px; }
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; border-bottom: 4px solid var(--main-purple); }
        .stat-card h2 { font-size: 32px; font-weight: 900; }

        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .card { background: var(--white); padding: 25px; border-radius: 25px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .card h3 { font-weight: 900; margin-bottom: 20px; border-right: 5px solid var(--main-purple); padding-right: 12px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: right; padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .progress-circle { width: 100px; height: 100px; border-radius: 50%; border: 8px solid #f1f5f9; border-top-color: var(--main-purple); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; margin: 0 auto 15px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <img src="logo.png.PNG" alt="بصيرة" style="width: 160px; margin-bottom: 10px;">
            <h1>بصيرة</h1>
            <p style="color: #64748b; margin-bottom: 20px;">النظام التعليمي الذكي</p>
            <input type="text" id="userInput" placeholder="اسم المستخدم">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button class="btn-go" onclick="appLogin()">دخول للنظام</button>
            <p id="error-msg">الاسم أو كلمة المرور (1234) غير صحيحة!</p>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <h2>بصيرة</h2>
        <div id="dynamic-menu"></div>
        <div class="nav-link" style="margin-top: auto;" onclick="location.reload()">🚪 خروج</div>
    </div>

    <div id="main-app" class="main-wrapper">
        <div class="header">
            <div style="font-weight: 900;">مرحباً، <span id="display-name"></span> 👋</div>
            <div class="user-profile">
                <div class="user-img"></div>
                <span>🔔</span>
            </div>
        </div>

        <div class="content">
            <div id="stats-area" class="grid-stats"></div>
            <div class="dashboard-grid">
                <div class="card">
                    <h3 id="primary-title">مخطط الأداء العام</h3>
                    <canvas id="mainChart"></canvas>
                </div>
                <div id="side-content"></div>
            </div>
        </div>
    </div>

<script>
    function appLogin() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        const error = document.getElementById('error-msg');

        // كلمة المرور هي 1234
        if (user !== "" && pass === "1234") {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('display-name').innerText = user;
            renderInterface(user);
        } else {
            error.style.display = 'block';
        }
    }{

    function renderInterface(role) {
        const menu = document.getElementById('dynamic-menu');
        const stats = document.getElementById('stats-area');
        const side = document.getElementById('side-content');
        const title = document.getElementById('primary-title');

        if(role.includes("معلمة") || role === "صالحة") {
            menu.innerHTML = <div class="nav-link active">🏠 طلابي</div><div class="nav-link">📊 الدرجات</div>;
            stats.innerHTML = <div class="stat-card"><h4>الفصل</h4><h2>1/أ</h2></div><div class="stat-card"><h4>الطلاب</h4><h2>24</h2></div><div class="stat-card"><h4>المهام</h4><h2>5</h2></div><div class="stat-card"><h4>التفاعل</h4><h2>90%</h2></div>;
            side.innerHTML = <div class="card"><h3>🤖 اقتراح AI</h3><p>يُنصح بمراجعة درس "الكسور" للطلاب المتعثرين.</p></div>;
            initChart([60, 80, 85, 95]);
        } else if(role.includes("مرشد") || role.includes("صحي")) {
            menu.innerHTML = <div class="nav-link active">🩺 السجل الصحي</div><div class="nav-link">👥 الحالات</div>;
            stats.innerHTML = <div class="stat-card"><h4>أعذار</h4><h2>3</h2></div><div class="stat-card"><h4>حالات</h4><h2>5</h2></div><div class="stat-card"><h4>صحتي</h4><h2>✔</h2></div><div class="stat-card"><h4>كوبونات</h4><h2>10</h2></div>;
            side.innerHTML = <div class="card"><h3>🏥 تنبيه صحي</h3><p>تم استلام عذر طبي للطالب عمار.</p></div>;
            initChart([40, 50, 70, 85]);
        } else if(role.includes("ولي")) {
            menu.innerHTML = <div class="nav-link active">👦 أبنائي</div><div class="nav-link">📩 تواصل</div>;
            stats.
innerHTML = <div class="stat-card"><h4>الأبناء</h4><h2>2</h2></div><div class="stat-card"><h4>النقاط</h4><h2>150</h2></div><div class="stat-card"><h4>المستوى</h4><h2>92%</h2></div><div class="stat-card"><h4>الغياب</h4><h2>0</h2></div>;
            side.innerHTML = <div class="card"><h3>📩 رسالة</h3><button class="btn-go" style="font-size:12px; padding:10px;">تواصل مع المعلمة</button></div>;
            initChart([70, 80, 85, 92]);
        } else {
            // واجهة الطالب أو المدير الافتراضية
            title.innerText = "الأداء الدراسي";
            menu.innerHTML = <div class="nav-link active">📊 أداء</div><div class="nav-link">🧠 خطة التحسين</div>;
            stats.innerHTML = <div class="stat-card"><h4>الدرجة</h4><h2>92%</h2></div><div class="stat-card"><h4>النقاط</h4><h2>88</h2></div><div class="stat-card"><h4>الترتيب</h4><h2>3</h2></div><div class="stat-card"><h4>الصحة</h4><h2>✔</h2></div>;
            side.innerHTML = <div class="card"><div class="progress-circle">75%</div><p style="text-align:center;">إنجاز الخطة</p></div>;
            initChart([50, 60, 80, 92]);
        }
    }

    function initChart(data) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['أسبوع 1', 'أسبوع 2', 'أسبوع 3', 'أسبوع 4'],
                datasets: [{ data: data, borderColor: '#6366f1', fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)', tension: 0.4 }]
            },
            options: { plugins: { legend: { display: false } } }
        });
    }
</script>
</body>
</html>
