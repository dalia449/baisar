<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بصيرة | Basira Ultimate Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --main-purple: #6366f1; 
            --gradient-purple: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
            --bg-light: #F8FAFC; --white: #ffffff; --text-dark: #1E293B;
            --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

        /* شاشة تسجيل الدخول */
        #login-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-box { text-align: center; width: 380px; padding: 40px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .login-box img { width: 150px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1.5px solid #eee; text-align: center; font-size: 16px; outline: none; }
        .btn-go { background: var(--gradient-purple); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 900; font-size: 18px; }
        #error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

        /* القائمة الجانبية (Sidebar) */
        .sidebar { width: 260px; background: var(--gradient-purple); color: white; padding: 30px 20px; display: flex; flex-direction: column; transition: 0.3s; }
        .sidebar h2 { font-size: 26px; font-weight: 900; margin-bottom: 40px; text-align: center; letter-spacing: 1px; }
        .nav-link { padding: 12px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; transition: 0.3s; color: rgba(255,255,255,0.8); font-size: 14px; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2); color: white; }

        /* المحتوى الرئيسي */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { height: 75px; background: var(--white); padding: 0 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .search-bar { background: #f1f5f9; padding: 10px 20px; border-radius: 50px; width: 350px; border: none; outline: none; font-size: 13px; }
        .user-profile { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; border: 2px solid var(--main-purple); }

        /* الشبكة والبطاقات */
        .content { padding: 30px; }
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; border-bottom: 4px solid var(--main-purple); transition: 0.3s; }
        .stat-card h2 { font-size: 32px; font-weight: 900; color: var(--text-dark); }

        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 30px; }
        .card { background: var(--white); padding: 25px; border-radius: 25px; box-shadow: var(--shadow); }
        .card h3 { font-weight: 900; margin-bottom: 20px; font-size: 18px; border-right: 5px solid var(--main-purple); padding-right: 12px; color: var(--text-dark); }

        .badge { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .bg-green { background: #dcfce7; color: var(--success); }
        .btn-ai { background: var(--gradient-purple); color: white; border: none; padding: 12px; border-radius: 50px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 15px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: right; padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .progress-circle { width: 100px; height: 100px; border-radius: 50%; border: 8px solid #f1f5f9; border-top-color: var(--main-purple); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; margin: 0 auto 15px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <img src="logo.png.PNG" onerror="this.src='https://via.placeholder.com/150x60?text=BASIRA'">
            <h1 style="color: var(--main-purple); font-weight: 900; margin-bottom: 10px;">بصيرة</h1>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">النظام التعليمي الذكي الشامل</p>
            
            <input type="text" id="userInput" placeholder="اسم المستخدم">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            
            <button class="btn-go" onclick="appLogin()">دخول للنظام</button>
            <p id="error-msg">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div id="sidebar" class="sidebar" style="display: none;">
        <h2>بصيرة</h2>
        <div id="dynamic-menu"></div>
        <div class="nav-link" style="margin-top: auto;" onclick="location.reload()">🚪 خروج</div>
    </div>

    <div id="main-app" class="main-wrapper" style="display: none;">
        <div class="header">
            <input type="text" class="search-bar" placeholder="بحث عن طالب، معلمة، أو تقرير...">
            <div class="user-profile">
                <span id="header-user-name"></span>
                <div class="user-img"></div>
                <span style="cursor: pointer; position: relative;">🔔<small style="position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; padding:2px 5px; font-size:9px;">3</small></span>
            </div>
        </div>

        <div class="content">
            <div id="stats-area" class="grid-stats"></div>
            <div class="dashboard-grid">
                <div id="primary-content" class="card">
                    <h3 id="primary-title">الأداء العام</h3>
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="side-column">
                    <div class="card" style="margin-bottom: 20px;">
                        <h3>🚨 التنبيهات</h3>
                        <div id="alert-list"></div>
                    </div>
                    <div class="card">
                        <h3>🤖 مساعد بصيرة (AI)</h3>
                        <p id="ai-text" style="font-size: 13px; color: #64748b; line-height: 1.6;">بناءً على تحليلي، يحتاج طلاب الصف الثاني لدعم إضافي في وحدة الكسور.</p>
                        <button class="btn-ai" onclick="askAI()">اسأل AI</button>
                    </div>
                </div>
            </div>
            <div id="secondary-content" class="grid-stats" style="grid-template-columns: 1fr 1fr; height: auto;"></div>
        </div>
    </div>

<script>

        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        const error = document.getElementById('error-msg');

        // التحقق من كلمة المرور (كلمة السر هي 1234)
        if (user !== "" && pass === "1234") {
            error.style.display = 'none';
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('header-user-name').innerText = user;
            renderInterface(user);
        } else {
