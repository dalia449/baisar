‏<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basira</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
--primary:#4F46E5;
--bg:#F1F5F9;
--card:#ffffff;
--text:#0F172A;
--sub:#64748B;
--danger:#EF4444;
--success:#22C55E;
}

body{margin:0;font-family:'Cairo';background:var(--bg)}

/* LOGIN */
.login{
display:flex;align-items:center;justify-content:center;height:100vh;
}
.card{
background:var(--card);
padding:30px;
border-radius:20px;
width:360px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}
.logo{width:120px;margin-bottom:10px}
input{
width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #e2e8f0;
}
button{
width:100%;padding:12px;margin-top:8px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:bold;cursor:pointer;
}

/* DASHBOARD */
.dashboard{padding:20px}
.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}
.box{
background:var(--card);
padding:15px;
border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,0.04);
}
h3{margin-bottom:10px;color:var(--primary)}
.small-btn{
padding:6px 10px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;font-size:12px;
}
.tag-danger{color:var(--danger)}
.tag-success{color:var(--success)}
.link{cursor:pointer;color:var(--primary)}
</style>
</head>
<body>
<div id="app"></div>
<script>

/* ===== DATA ===== */
const teachers=[
{name:"موضي",subject:"الشريعة",score:96},
{name:"هدى",subject:"الحاسب",score:88},
{name:"العنود",subject:"الانجليزي",score:91},
{name:"فاديه",subject:"الاجتماعيات",score:84},
{name:"صالحة",subject:"لغتي",score:82},
{name:"حصة",subject:"علوم",score:89}
];

const students=[
{name:"أحمد علي",class:"1/1",subject:"رياضيات",level:60,behavior:"إزعاج",parent:"علي",points:70},
{name:"سارة محمد",class:"2/1",subject:"علوم",level:90,behavior:"ممتاز",parent:"محمد",points:120},
{name:"جوري علي",class:"3/2",subject:"لغتي",level:75,behavior:"متوسط",parent:"علي",points:95},
{name:"راكان ساعد",class:"1/2",subject:"الحاسب",level:50,behavior:"مشاغب",parent:"ساعد",points:60},
{name:"ود ساعد",class:"2/3",subject:"انجليزي",level:88,behavior:"ممتاز",parent:"ساعد",points:110},
{name:"طالب وهمي",class:"1/3",subject:"علوم",level:55,behavior:"ضعيف",parent:"—",points:40}
];

let alerts=[];
let tickets=[];

/* ===== LOGIN ===== */
function loginUI(){
app.innerHTML=`
<div class="login">
<div class="card">
<img src="logo.png.PNG" class="logo">
<h2>Basira</h2>
<p class="sub">نظام الإرشاد الذكي</p>
<input id="user" placeholder="اسم المستخدم">
<input id="school" placeholder="اسم المدرسة (للوزارة)">
<button onclick="login()">دخول</button>
</div>
</div>`;
}

function login(){
let u=document.getElementById("user").value;
if(u=="هيا") admin();
else if(u=="وزارة") ministry();
else if(teachers.find(t=>t.name==u)) teacher(u);
else student();
}

/* ===== ADMIN ===== */
function admin(){
app.innerHTML=`
<div class="dashboard">

<div class="header">
<h2>لوحة المديرة</h2>
<button onclick="loginUI()">خروج</button>
</div>

<div class="grid">

<div class="box">
<h3>👩‍🏫 المعلمات</h3>
${teachers.map(t=>`
<p>${t.name} - ${t.score}%
${t.score<85?`<span class="tag-danger">⚠</span><button class="small-btn" onclick="ticket('${t.name}')">اعتراض</button>`:`<span class="tag-success">✔</span>`}
</p>`).join("")}
</div>

<div class="box">
<h3>👨‍🎓 الطلاب</h3>
${students.map(s=>`
<p class="link" onclick="studentPage('${s.name}')">${s.name} - ${s.level}%</p>
`).join("")}
</div>

<div class="box">
<h3>🚨 التنبيهات</h3>
${alerts.map(a=>`<p>${a}</p>`).join("")}
</div>

<div class="box">
<h3>🤖 AI</h3>
<button class="small-btn" onclick="askAI()">مساعدة</button>
</div>

<div class="box">
<h3>📊 تحليل</h3>
<canvas id="chart"></canvas>
</div>

<div class="box">
<h3>🏫 الشراكة</h3>
<button class="small-btn" onclick="community()">عرض</button>
</div>

<div class="box">
<h3>🏆 الشهادات</h3>
<button class="small-btn" onclick="cert()">إنشاء</button>
</div>

<div class="box">
<h3>📅 الشواهد</h3>
<p>اليوم الوطني 23 سبتمبر</p>
<p>يوم المعلم 5 أكتوبر</p>
<p>يوم التأسيس 22 فبراير</p>
<button class="small-btn">اعتماد</button>
</div>

</div>
</div>`;

new Chart(document.getElementById('chart'),{
type:'bar',
data:{labels:teachers.map(t=>t.name),
datasets:[{data:teachers.map(t=>t.score),backgroundColor:'#4F46E5'}]}
});
}

/* ===== STUDENT PAGE ===== */
function studentPage(name){
let s=students.find(x=>x.name==name);

app.innerHTML=`
<div class="dashboard">
<div class="header">
<h2>${s.name}</h2>
<button onclick="admin()">رجوع</button>
</div>

<div class="grid">

<div class="box">
<h3>📊 الأداء</h3>
<p>المادة: ${s.subject}</p>
<p>المستوى: ${s.level}%</p>
<p class="${s.level<70?'tag-danger':'tag-success'}">${s.level<70?'ضعف':'جيد'}</p>
</div>

<div class="box">
<h3>🚨 سلوك</h3>
<p class="${s.behavior!='ممتاز'?'tag-danger':'tag-success'}">${s.behavior}</p>
<button class="small-btn" onclick="alertFlow('${s.name}')">إرسال تنبيه</button>
</div>

<div class="box">
<h3>👨‍👩‍👧 ولي الأمر</h3>
<p>${s.parent}</p>
<p>تم الإشعار ✔</p>
</div>

<div class="box">
<h3>🧑‍⚕️ الصحة</h3>
<p>مرتبط بتطبيق صحتي</p>
<button class="small-btn" onclick="alert('تم قبول العذر')">تأكيد غياب</button>
</div>

</div>
</div>`;
}

/* ===== ALERT FLOW ===== */
function alertFlow(name){
alerts.push(`${name} → معلم → مرشد → وكيلة → ولي أمر`);
admin();
}

/* ===== AI ===== */
function askAI(){
let q=prompt("اكتب مشكلتك:");
let r="🤖 تم اقتراح خطة تحسين";
if(q.
includes("غياب")) r="راجع المرشد الصحي";
alert(r);
}

/* ===== CERT ===== */
function cert(){
let top=[...students].sort((a,b)=>b.points-a.points).slice(0,3);
app.innerHTML=top.map(s=>`
<div class="box"><h3>🏆 شهادة</h3><p>${s.name}</p></div>
`).join("");
}

/* ===== COMMUNITY ===== */
function community(){
app.innerHTML=`<div class="dashboard"><div class="box"><h3>🏫 رحلات</h3><p>للطلاب الأعلى نقاط</p></div></div>`;
}

/* ===== TEACHER ===== */
function teacher(name){
let my=students.filter(s=>s.subject==teachers.find(t=>t.name==name).subject);

app.innerHTML=`
<div class="dashboard">
<div class="header">
<h2>${name}</h2>
<button onclick="loginUI()">خروج</button>
</div>

<div class="grid">

<div class="box">
<h3>👨‍🎓 طلابي</h3>
${my.map(s=>`<p>${s.name} - ${s.level}%</p>`).join("")}
</div>

<div class="box">
<h3>🎮 نشاط</h3>
<p>2+2؟</p>
<button class="small-btn" onclick="alert('صح')">4</button>
<button class="small-btn">5</button>
</div>

</div>
</div>`;
}

/* ===== MINISTRY ===== */
function ministry(){
app.innerHTML=`
<div class="dashboard">
<div class="header">
<h2>وزارة التعليم - مدرسة نخال</h2>
<button onclick="loginUI()">خروج</button>
</div>

<div class="grid">

<div class="box">
<h3>📊 تحليل شامل</h3>
<canvas id="c2"></canvas>
</div>

<div class="box">
<h3>👩‍🏫 أداء المعلمين</h3>
${teachers.map(t=>`<p>${t.name}: ${t.score}%</p>`).join("")}
</div>

</div>
</div>`;

new Chart(document.getElementById('c2'),{
type:'line',
data:{labels:['1','2','3'],datasets:[{data:[60,80,95],borderColor:'#4F46E5'}]}
});
}

loginUI();

</script>
