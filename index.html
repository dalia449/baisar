<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بصيرة | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366F1; --text: #1E293B; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Arabic', sans-serif; }
        
        /* شاشة بيضاء بالكامل */
        body { 
            background-color: #FFFFFF; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* تنسيق اللوقو ليكون بطل الشاشة */
        .logo-img {
            width: 250px; /* حجم مناسب للوقو */
            height: auto;
            margin-bottom: 30px;
        }

        h1 { font-size: 24px; color: var(--text); margin-bottom: 10px; font-weight: 800; }
        p { color: #64748B; margin-bottom: 30px; font-size: 15px; }

        .input-group { margin-bottom: 15px; }
        
        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1.5px solid #E2E8F0;
            background: #F8FAFC;
            font-size: 16px;
            text-align: center;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover { background: #4338CA; transform: translateY(-2px); }

        /* تذييل بسيط */
        .footer-text {
            margin-top: 40px;
            font-size: 12px;
            color: #94A3B8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="logo.png.PNG" alt="بصيرة" class="logo-img">
        
        <h1>تسجيل الدخول</h1>
        <p>مرحباً بك في نظام بصيرة الذكي</p>

        <div class="input-group">
            <input type="text" placeholder="اسم المستخدم">
        </div>
        
        <div class="input-group">
            <input type="password" placeholder="كلمة المرور">
        </div>

        <button class="login-btn" onclick="alert('جاري الدخول...')">دخول للنظام</button>

        <div class="footer-text">
            B A S I R A &copy; 2026
        </div>
    </div>

</body>
</html>
