<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بصيرة</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#F5F7FB;
}

.app{
display:flex;
height:100vh;
}

/* sidebar */

.sidebar{
width:240px;
background:#4F46E5;
color:white;
padding:20px;
}

.logo{
font-size:22px;
font-weight:700;
margin-bottom:40px;
}

.menu{
margin:15px 0;
cursor:pointer;
opacity:.9;
}

.menu:hover{
opacity:1;
}

/* main */

.main{
flex:1;
padding:30px;
}

.header{
font-size:24px;
font-weight:700;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.number{
font-size:26px;
font-weight:700;
color:#4F46E5;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
margin-top:20px;
}

.chart{
height:220px;
background:white;
border-radius:16px;
padding:20px;
}

.student{
background:white;
border-radius:16px;
padding:20px;
}

.progress{
height:10px;
background:#eee;
border-radius:10px;
overflow:hidden;
margin:8px 0;
}

.bar{
height:100%;
background:#4F46E5;
}

.alert{
background:#FEF2F2;
padding:10px;
border-radius:10px;
color:#EF4444;
margin-top:15px;
}

.ai{
background:white;
margin-top:20px;
padding:20px;
border-radius:16px;
}

button{
background:#4F46E5;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<div class="logo">بصيرة</div>

<div class="menu">لوحة التحكم</div>
<div class="menu">الطلاب</div>
<div class="menu">التنبيهات</div>
<div class="menu">التحليلات</div>
<div class="menu">الإعدادات</div>

</div>

<div class="main">

<div class="header">لوحة التحكم</div>

<div class="cards">

<div class="card">
عدد الطلاب
<div class="number">428</div>
</div>

<div class="card">
طلاب في خطر
<div class="number">12</div>
</div>

<div class="card">
متوسط الأداء
<div class="number">78%</div>
</div>

</div>

<div class="grid">

<div class="chart">
اتجاه الأداء
<br><br>
📈 📉 📈 📈 📉
</div>

<div class="student">

<strong>أحمد علي</strong>

<div>رياضيات 65%</div>
<div class="progress"><div class="bar" style="width:65%"></div></div>

<div>انجليزي 82%</div>
<div class="progress"><div class="bar" style="width:82%"></div></div>

<div>علوم 78%</div>
<div class="progress"><div class="bar" style="width:78%"></div></div>

<div class="alert">
تم اكتشاف انخفاض في الأداء
</div>

<button>خطة التحسين</button>

</div>

</div>

<div class="ai">

<strong>المساعد الذكي</strong>

<p>
تم اكتشاف ضعف في الرياضيات
نوصي بمشاهدة الدروس التدريبية
</p>

<button>إنشاء خطة تلقائية</button>

</div>

</div>

</div>

</body>
</html>
