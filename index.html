<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بصيرة | Basira AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4B49AC; --teacher: #ec4899; --health: #10b981; 
            --acad: #f59e0b; --transport: #06b6d4; --parent: #8b5cf6; 
            --student: #2563eb; --dark: #2B2A4C; --bg: #F5F7FF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        /* شاشة الدخول */
        #login-overlay { position: fixed; inset: 0; background: white; z-index: 2000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f5f7ff 0%, #c3dafe 100%); }
        .login-box { background: white; text-align: center; width: 420px; padding: 50px; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
        .login-box img { width: 120px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1.5px solid #E0E7FF; text-align: center; font-size: 16px; }
        .btn-go { background: var(--primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 15px; cursor: pointer; font-weight: 900; font-size: 18px; }

        /* القائمة الجانبية */
        .sidebar { width: 280px; background: var(--dark); color: white; padding: 30px 15px; display: none; flex-direction: column; }
        .sidebar h2 { font-weight: 900; font-size: 28px; text-align: center; margin-bottom: 40px; }
        .nav-link { padding: 15px 20px; border-radius: 15px; margin-bottom: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; color: #D1D5DB; }
        .nav-link:hover, .nav-link.active { background: var(--primary); color: white; }

        /* المحتوى */
        .main-wrapper { flex: 1; display: none; flex-direction: column; overflow-y: auto; }
        .header { height: 85px; background: white; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.03); }
        .badge { padding: 6px 18px; border-radius: 25px; color: white; font-size: 13px; font-weight: 700; }

        .content { padding: 35px; }
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 25px; text-align: center; border-bottom: 6px solid; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .stat-card h4 { color: #6B7280; font-size: 14px; }
        .stat-card h2 { font-size: 28px; font-weight: 900; margin-top: 5px; }

        /* قسم الذكاء الاصطناعي والدعم */
        .ai-panel { background: #EEF2FF; border: 1.5px dashed var(--primary); padding: 25px; border-radius: 30px; margin-bottom: 30px; }
        .chat-area { background: white; border-radius: 20px; padding: 15px; height: 160px; overflow-y: auto; margin: 15px 0; border: 1px solid #E0E7FF; font-size: 14px; }
        .msg-ai { background: #f0f3ff; padding: 10px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid var(--primary); }
        
        .display-view { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: right; color: #6B7280; padding: 12px; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; font-weight: 600; }

        .danger-high { color: #ef4444; }
        .danger-med { color: #f59e0b; }
        .danger-low { color: #10b981; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <img src="logo.
png.PNG" alt="بصيرة">
            <h1 style="color: var(--primary); font-weight: 900;">بصيرة</h1>
            <input type="text" id="userInput" placeholder="اسم المستخدم (هيا، معلمة، أكاديمي، ولي أمر...)">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button class="btn-go" onclick="handleLogin()">دخول للنظام</button>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <h2>بصيرة</h2>
        <div id="menu-box"></div>
        <div class="nav-link" style="margin-top:auto" onclick="location.reload()">🚪 خروج</div>
    </div>

    <div id="main-app" class="main-wrapper">
        <div class="header">
            <div style="font-weight: 900; font-size: 18px;">مرحباً، <span id="user-title"></span></div>
            <div id="role-badge" class="badge"></div>
        </div>

        <div class="content">
            <div class="ai-panel">
                <h4 style="color: var(--primary)">🤖 مساعد بصيرة الذكي (تنبيهات ودعم فني)</h4>
                <div class="chat-area" id="ai-chat"></div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="chat-in" placeholder="اسألي بصيرة..." style="flex:1; padding:10px; border-radius:10px; border:1px solid #ddd;">
                    <button onclick="send()" style="background:var(--primary); color:white; padding:0 20px; border:none; border-radius:10px; cursor:pointer;">إرسال</button>
                </div>
            </div>

            <div id="stats-grid" class="grid-stats"></div>

            <div class="display-view">
                <h3 id="view-title">التقرير العام</h3>
                <div id="dynamic-content">
                    <canvas id="mainChart" height="100"></canvas>
                </div>
            </div>
        </div>
    </div>
