<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بصيرة | لوحة التحليل والدعم الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* تعريف متغيرات الألوان من لوحة الألوان المرفقة */
        :root {
            --primary-color: #4F46E5; /* البنفسجي الأساسي */
            --secondary-color: #6366F1;
            --success-color: #22C55E;
            --error-color: #EF4444;
            --warning-color: #F59E0B;
            --background: #F8FAFC; /* خلفية الصفحة */
            --surface: #FFFFFF; /* خلفية البطاقات */
            --text-primary: #0F172A; /* النص الأساسي غامق */
            --text-secondary: #64748B; /* النص الثانوي */
            --border: #E2E8F0; /* لون الحدود */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /*Sidebar - جهة اليسار */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item.active, .nav-item:hover {
            background: #EEF2FF; /* خلفية فاتحة عند الاختيار */
            color: var(--primary-color);
            font-weight: 600;
        }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        /* بطاقات الإحصائيات Top Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        /* التوزيع الوسطي */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 24px;
        }

        /* نظام التذاكر الذكي Ticket Box */
        .ticket-box {
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

            font-weight: 700;
            font-size: 18px;
