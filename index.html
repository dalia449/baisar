<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basira | منصة بصيرة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366F1;
            --primary-soft: #EEF2FF;
            --bg: #F9FAFB;
            --card: #FFFFFF;
            --text-main: #111827;
            --text-sub: #6B7280;
            --border: #F3F4F6;
            --danger: #E11D48;
            --warning: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Arabic', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        nav {
            width: 280px;
            background: var(--card);
            border-left: 1px solid var(--border);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
        }

        .logo-box img { width: 45px; height: 45px; border-radius: 10px; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--text-sub);
            text-decoration: none;
            margin-bottom: 8px;
            transition: 0.2s;
            font-weight: 600;
        }

        .nav-link.active { background: var(--primary-soft); color: var(--primary); }

        /* Main */
        main { flex: 1; padding: 40px; overflow-y: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        /* Stats Section */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .card h3 { font-size: 13px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .card p { font-size: 28px; font-weight: 700; color: var(--text-main); }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 24px;
        }

        /* AI Chat System */
        .ticket-section {
            background: var(--card);
            border-radius: 28px;
            padding: 28px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .chat-area {
            height: 380px;
            overflow-y: auto;
            padding: 15px;
            background: #FDFDFF;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        .bubble.ai { background: var(--primary); color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .bubble.user { background: var(--primary-soft); color: var(--primary); align-self: flex-end; border-bottom-left-radius: 4px; }

        .input-box {
            display: flex;
            gap: 12px;
            background: #fff;
            padding: 6px;
