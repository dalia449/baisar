<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بصيرة | BASIRA AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4B49AC; --bg: #F5F7FF; --white: #ffffff;
            --teacher: #ec4899; --health: #10b981; --acad: #f59e0b;
            --transport: #06b6d4; --parent: #8b5cf6; --dark: #2B2A4C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        /* شاشة الدخول */
        #login-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f5f7ff 0%, #c3dafe 100%); }
        .login-box { background: white; text-align: center; width: 400px; padding: 50px; border-radius: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
        .login-box img { width: 140px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1.5px solid #E0E7FF; text-align: center; font-size: 16px; }
        .btn-go { background: var(--primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 15px; cursor: pointer; font-weight: 900; font-size: 18px; }

        /* القائمة الجانبية */
        .sidebar { width: 280px; background: var(--dark); color: white; padding: 30px 15px; display: none; flex-direction: column; }
        .sidebar h2 { font-weight: 900; font-size: 28px; text-align: center; margin-bottom: 40px; }
        .nav-link { padding: 15px 20px; border-radius: 15px; margin-bottom: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; color: #D1D5DB; }
        .nav-link:hover, .nav-link.active { background: var(--primary); color: white; }

        /* المحتوى */
        .main-wrapper { flex: 1; display: none; flex-direction: column; overflow-y: auto; }
        .header { height: 85px; background: white; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.03); }
        .badge { padding: 6px 18px; border-radius: 25px; color: white; font-size: 13px; font-weight: 700; }
        .content { padding: 35px; }

        /* الكروت والرسومات */
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 25px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.02); border-bottom: 6px solid; transition: 0.3s; }
        .stat-card h4 { color: #6B7280; font-size: 14px; }
        .stat-card h2 { font-size: 30px; font-weight: 900; }

        .ai-box { background: #EEF2FF; border: 1.5px dashed var(--primary); padding: 25px; border-radius: 25px; margin-top: 25px; }
        .card-view { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); display: none; }
        .card-view.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: right; color: #6B7280; padding: 12px; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <img src="logo.png.PNG" alt="بصيرة">
            <h1 style="color: var(--primary); font-weight: 900;">بصيرة</h1>
            <input type="text" id="userInput" placeholder="اسم المستخدم">
            <input type="password" id="passInput" placeholder="كلمة المرور">
<button class="btn-go" onclick="appLogin()">دخول للنظام</button>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <h2>بصيرة</h2>
        <div id="dynamic-menu"></div>
        <div class="nav-link" style="margin-top:auto" onclick="location.reload()">🚪 خروج</div>
    </div>

    <div id="main-app" class="main-wrapper">
        <div class="header">
            <div style="font-weight:900; font-size:18px;">مرحباً، <span id="display-name"></span> 👋</div>
            <div id="role-badge" class="badge"></div>
        </div>

        <div class="content">
            <div id="stats-area" class="grid-stats"></div>

            <div id="view-dashboard" class="card-view active">
                <h3>التحليل البياني</h3>
                <canvas id="mainChart" height="100"></canvas>
            </div>

            <div id="view-details" class="card-view">
                <h3 id="details-title">التفاصيل</h3>
                <div id="details-content"></div>
            </div>

            <div class="ai-box">
                <h4 style="color: var(--primary)">🤖 رؤية بصيرة الذكية:</h4>
                <p id="ai-text"></p>
            </div>
        </div>
    </div>

<script>
    let myChart = null;
    let currentUserRole = "";

    function appLogin() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (user !== "" && pass === "1234") {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('display-name').innerText = user;
            setupRole(user);
        }
    }

    function setupRole(user) {
        const menu = document.getElementById('dynamic-menu');
        const badge = document.getElementById('role-badge');
        let cfg = {};

        if (user === "هيا" || user === "مدير") {
            cfg = { label: 'مدير النظام', color: 'var(--primary)', cls: 'theme-admin', 
                   btns: ['الرئيسية', 'المدارس', 'المعلمين'], 
                   stats: [['الطلاب', '1200'], ['المعلمين', '85'], ['الأداء', '94%'], ['تنبيه', '0']],
                   ai: 'النظام يعمل بكفاءة عالية، تم رصد زيادة في التفاعل بنسبة 10%.', chart: [60, 80, 85, 94] };
        } else if (user.includes("معلم")) {
            cfg = { label: 'معلمة', color: 'var(--teacher)', cls: 'theme-teacher',
                   btns: ['الرئيسية', 'فصولي', 'الدرجات'],
                   stats: [['طالباتي', '28'], ['المنهج', '80%'], ['الغياب', '2'], ['التقييم', 'ممتاز']],
                   ai: 'ننصح بالتركيز على مهارات التحليل لدى طالبات الفصل (ب).', chart: [50, 65, 80, 87] };
        } else if (user.includes("صحي")) {
            cfg = { label: 'مرشد صحي', color: 'var(--health)', cls: 'theme-health',
                   btns: ['الرئيسية', 'العيادة', 'السجلات'],
                   stats: [['حالات', '3'], ['فحوصات', '95%'], ['تطعيم', 'مكتمل'], ['إسعاف', '1']],
                   ai: 'بيئة المدرسة صحية تماماً، تم تحديث سجلات التطعيم لـ 400 طالبة.', chart: [30, 45, 60, 75] };
        } else if (user.includes("نقل")) {
            cfg = { label: 'مسؤولة نقل', color: 'var(--transport)', cls: 'theme-transport',
                   btns: ['الرئيسية', 'الحافلات', 'المسارات'],
                   stats: [['باصات', '12'], ['طالبات', '340'], ['تأخير', '0'], ['وقود', '88%']],
                   ai: 'تم تحسين مسار الحافلة رقم 4 لتوفير 10 دقائق من وقت الرحلة.', chart: [90, 95, 92, 100] };
        } else if (user.includes("ولي")) {
            cfg = { label: 'ولي أمر', color: 'var(--parent)', cls: 'theme-parent',
                   btns: ['الرئيسية', 'الأبناء', 'الرسائل'],
                   stats: [['المعدل', '96%'], ['غياب', '0'], ['سلوك', '100%'], ['اشعار', '2']],
                   ai: 'ابنتكم مرشحة لجائزة الطالبة المثالية لهذا الشهر.', chart: [80, 85, 92, 96] };
        }

        badge.innerText = cfg.label; badge.style.backgroundColor = cfg.
